<style>
/* Layout: one narrow column — ledger summary strip, add-lesson form, month-grouped lesson rows; review sheet slides over */
:root{
  --bg:#f4f4f4; --paper:#ffffff; --ink:#111111; --muted:#7a7a7a; --line:#e6e6e6; --tile:#f0f0f0;
  --accent:#111111; --accent-soft:#ececec; --ok:#1d8a5b; --ok-soft:#e4f3ea; --warn:#c2410c; --warn-soft:#fbeadb;
  --f-display:"Geist","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Geist","Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0f0f; --paper:#181818; --ink:#f2f2f2; --muted:#9a9a9a; --line:#2a2a2a; --tile:#222222;
  --accent:#f2f2f2; --accent-soft:#2a2a2a; --ok:#5fcf9b; --ok-soft:#173226; --warn:#f0a066; --warn-soft:#3a2616; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,6vw,28px);letter-spacing:-.01em;margin:0}
h1 small{display:block;font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--muted);letter-spacing:.04em;margin-top:4px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{white-space:nowrap}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--warn)}
.btn.study{background:var(--tile);border-color:transparent;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.err{background:var(--warn)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border:1px solid var(--line);border-radius:16px}
.stat{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.stat .v{font-family:var(--f-display);font-size:clamp(17px,4.6vw,22px);font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted);display:block}
.stat .v.warn{color:var(--warn)}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

form#add{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
form#add h2{margin:0;font-size:15px}
.row{display:grid;grid-template-columns:1.2fr .7fr .9fr;gap:10px}
@media (max-width:560px){.row{grid-template-columns:1fr 1fr}.row .full{grid-column:1/-1}}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--tile);border:1px solid transparent;border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:120px}
.amount-preview{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.form-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.check{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
.check input{width:auto}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.pay{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.claim{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.claim:first-child{border-top:0}
.claim .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.claim .n{font-size:14px}
.claim .a{font-family:var(--f-mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.claim .x{grid-column:2;justify-self:end}
.bar{height:8px;background:var(--tile);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.budget{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.budget .big{font-family:var(--f-display);font-size:clamp(20px,6vw,26px);font-weight:700;font-variant-numeric:tabular-nums}
.budget .row2{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pay:first-child{border-top:0}
.pay .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pay .n{font-size:14px}
.pay .a{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.pay .x{grid-column:2;justify-self:end}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-inline:2px}
.sec-h h3{margin:0;font-family:var(--f-display);font-size:17px}
.sec-h span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--warn)}

.month{display:grid;gap:8px}
.month-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-inline:2px}
.month-h h3{margin:0;font-family:var(--f-display);font-size:17px}
.month-h span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lesson{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.lesson:first-child{border-top:0}
.lesson.editing{background:var(--tile)}
.date{font-family:var(--f-mono);font-variant-numeric:tabular-nums;line-height:1.3}
.date b{display:block;font-size:20px;font-weight:500}
.date span{font-size:11px;color:var(--muted)}
.body{min-width:0}
.topic{font-weight:500;overflow-wrap:anywhere}
.notes{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px;padding:10px 12px;background:var(--tile);border-radius:10px;line-height:1.65}
.notes.clamp{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.more{background:none;border:0;padding:4px 0 0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer}
.meta{font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--f-mono)}
.lrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.right{display:grid;justify-items:end;gap:6px}
.amt{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{border-radius:999px;padding:2px 10px;border:0;cursor:pointer;font:inherit;font-size:12px}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.unpaid{background:var(--warn-soft);color:var(--warn)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
@media (max-width:480px){.lesson{grid-template-columns:44px 1fr}.right{grid-column:2;justify-items:start;grid-auto-flow:column;align-items:center;justify-content:start;flex-wrap:wrap}.pay{grid-template-columns:1fr auto}}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px;max-height:86vh}}
.sheet-h{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:16px 16px 8px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-size:19px}
.sheet-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px}
.tabs{display:flex;gap:4px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:14px;border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
.sheet-b{overflow:auto;padding:16px;display:grid;gap:14px;-webkit-overflow-scrolling:touch}
.points{margin:0;padding-left:1.2em;display:grid;gap:8px}
.vocab{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.vocab .en{font-family:var(--f-mono);font-weight:500}
.vocab .zh{color:var(--muted)}
.h4{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:0}
.card{border:1px solid var(--line);border-radius:16px;min-height:180px;padding:22px;display:grid;place-items:center;text-align:center;cursor:pointer;background:var(--paper);gap:12px}
.card .zh{font-size:18px;font-weight:500}
.card .en{font-size:17px;color:var(--ink);font-weight:600;border-top:1px dashed var(--line);padding-top:12px}
.card .hint{font-size:12px;color:var(--muted)}
.cardnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.q{font-size:16px;font-weight:500}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.explain{font-size:14px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px}
.score{font-family:var(--f-display);font-size:34px;font-weight:700;text-align:center}
.note{font-size:13px;color:var(--muted)}
.setting{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0;padding-top:0}
.mono{font-family:var(--f-mono);font-size:12px;word-break:break-all;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}
@media (prefers-reduced-motion:no-preference){.overlay .sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
/* bottom tab bar + views + speech + sfx */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:4px;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.tabbar button{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;border:0;background:none;color:var(--muted);font-family:inherit;font-size:11px;font-weight:500;line-height:1;border-radius:12px;cursor:pointer}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body[data-view="lessons"] #paysec,body[data-view="lessons"] #claimsec,body[data-view="pay"] #add,body[data-view="pay"] #lessons,body[data-view="pay"] #claimsec,body[data-view="claim"] .stats,body[data-view="claim"] #add,body[data-view="claim"] #lessons,body[data-view="claim"] #paysec{display:none}
.spk{display:inline-flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;vertical-align:middle;padding:0}
.spk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.points li>span,.vocab .en>span{flex:1}
.points li,.vocab .en{display:flex;align-items:center;gap:8px}
.card .en{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>英語家教上課本<small>NT$1,200 / HOUR · 月結預付</small></h1>
    <div class="hbtns">
      <button class="btn study" id="mix" type="button">綜合測驗</button>
      <button class="btn" id="jump" type="button">＋ 新增</button>
      <button class="btn" id="gear" type="button" aria-label="設定">設定</button>
    </div>
  </header>
  <div class="sync"><span class="dot" id="dot"></span><span id="synctext">尚未連線 Google Sheet</span></div>

  <section class="stats" aria-label="統計">
    <div class="stat"><div class="k">累計學費</div><div class="v" id="s-total">NT$0</div></div>
    <div class="stat"><div class="k">上課堂數 / 時數</div><div class="v" id="s-count">0 堂</div></div>
    <div class="stat"><div class="k">本月學費</div><div class="v" id="s-month">NT$0</div></div>
    <div class="stat"><div class="k">預付餘額</div><div class="v" id="s-unpaid">NT$0</div></div>
  </section>

  <form id="add" autocomplete="off">
    <h2 id="form-title">新增一堂課</h2>
    <div class="row">
      <label>日期<input type="date" id="f-date" required></label>
      <label>時數<input type="number" id="f-hours" min="0.25" step="0.25" value="1" required inputmode="decimal"></label>
      <label class="full">每小時費用<input type="number" id="f-rate" min="0" step="50" value="1200" required inputmode="numeric"></label>
    </div>
    <label>上課主題<input type="text" id="f-topic" placeholder="例如：Small talk、商務 email、過去完成式"></label>
    <label>筆記 / 單字<textarea id="f-notes" placeholder="把這堂課的筆記整段貼上"></textarea></label>
    <div class="form-foot">
      <span></span><input type="hidden" id="f-paid" value="1">
      <span class="amount-preview" id="preview">本堂 NT$1,200</span>
      <div class="actions">
        <button class="btn" type="button" id="cancel" hidden>取消編輯</button>
        <button class="btn primary" type="submit" id="submit">新增</button>
      </div>
    </div>
    <div class="status" id="status" role="status"></div>
  </form>

  <section id="claimsec" aria-label="報帳" class="month">
    <div class="sec-h"><h3>公司報帳</h3><span id="claim-sum"></span></div>
    <div class="budget">
      <div class="row2"><span id="budget-label">年度補助 USD 1,000</span><span id="budget-rate"></span></div>
      <div class="big" id="budget-left"></div>
      <div class="bar"><i id="budget-bar" style="width:0%"></i></div>
      <div class="row2"><span id="budget-used"></span><span id="budget-period"></span></div>
    </div>
    <div class="list" id="claimlist"></div>
    <div class="actions"><button class="btn primary small" id="claim-new" type="button">產生報帳明細</button><button class="btn small" id="claim-set" type="button">補助設定</button></div>
  </section>
  <section id="paysec" aria-label="付款紀錄" class="month">
    <div class="sec-h"><h3>付款紀錄</h3><span id="pay-sum"></span></div>
    <div class="list" id="paylist"></div>
    <div class="actions"><button class="btn small" id="pay-add" type="button">＋ 記一筆付款</button><button class="btn small" id="pay-img" type="button">下載付款明細圖</button></div>
  </section>
  <section id="lessons" aria-label="上課紀錄">
    <div class="empty" id="empty"><b>還沒有上課紀錄</b>連上 Google Sheet 後會自動載入；或在上面填日期和筆記，按「新增」。</div>
  </section>
  <nav class="tabbar" aria-label="主選單">
    <button type="button" data-view="lessons"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5V5.5M8 7h8M8 11h6"/></svg>上課</button>
    <button type="button" data-view="pay"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10h18M7 14.5h3"/></svg>付款</button>
    <button type="button" data-view="claim"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>報帳</button>
  </nav>
</div>

<div class="overlay" id="ov" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sheet-h"><div><h2 id="sh-title"></h2><p id="sh-sub"></p></div><button class="x" id="sh-x" type="button" aria-label="關閉">×</button></div>
    <div class="tabs" id="sh-tabs"></div>
    <div class="sheet-b" id="sh-b"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- note extraction (fallback for lessons without a study pack) ---------- */
function extractStudy(notes){
  const CJK=/[㐀-鿿！-～]/;
  const clean=s=>s.replace(/^[\s*＊•⭐✅👉🌴😡🤯>\-–—→]+/u,'').replace(/\s+/g,' ').trim();
  const lines=(notes||'').split('\n').map(s=>s.trim());
  const vocab=[],cards=[],points=[];const seenV=new Set(),seenP=new Set();
  const isZh=s=>{const c=(s.match(/[㐀-鿿]/g)||[]).length;const a=(s.match(/[A-Za-z]/g)||[]).length;return c>=2&&c>=a/3;};
  const isEn=s=>{const t=clean(s);if(CJK.test(t.replace(/[（）()]/g,'')))return false;return /[A-Za-z]/.test(t)&&t.split(' ').length>=4;};
  for(let i=0;i<lines.length;i++){
    const raw=lines[i];if(!raw)continue;const t=clean(raw);
    if(/^[⭐✅]/u.test(raw)&&!CJK.test(t)&&t.split(' ').length>=4)points.push(t);
    if(isEn(raw)){const nx=lines[i+1]||'';if(nx&&isZh(nx)&&!seenP.has(t)){seenP.add(t);cards.push({en:t,zh:clean(nx).replace(/^[（(]|[）)]$/g,'')});}continue;}
    const m=t.match(/^([A-Za-z][A-Za-z '’\-\/.,+]*?(?:\s*\((?:v|n|adj|adv)\))?)\s*[=＝:：]?\s*([㐀-鿿][^A-Za-z]*)$/);
    if(m){const en=m[1].trim().replace(/[\s,.]+$/,''),zh=m[2].trim().replace(/^[（(]|[）)]$/g,'').trim();
      if(en.replace(/\((v|n|adj|adv)\)/,'').trim().split(/\s+/).length<=6&&en.length>=2&&!seenV.has(en.toLowerCase())){seenV.add(en.toLowerCase());vocab.push({en,zh});}}
  }
  // simple quiz from vocab
  const quiz=[];const pool=vocab.slice();
  shuffle(pool).slice(0,5).forEach(v=>{
    const others=shuffle(vocab.filter(o=>o!==v)).slice(0,3).map(o=>o.en);
    if(others.length<3)return;
    const options=shuffle([v.en,...others]);quiz.push({q:`「${v.zh}」的英文是？`,options,answer:options.indexOf(v.en),explain:`${v.en}：${v.zh}`});
  });
  return {points:points.slice(0,5),vocab,cards,quiz,auto:true};
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- sync with Google Sheet (Apps Script) ---------- */
function readHash(){
  const m=location.hash.match(/#sync=([^&]+)/);if(!m)return;
  try{const [url,token,sheet]=decodeURIComponent(escape(atob(m[1]))).split('|');if(url&&token){sync={url,token,sheet:sheet||''};lsSet(LS_SYNC,sync);toast('已連上 Google Sheet');}}catch(e){}
  history.replaceState(null,'',location.pathname);
}
async function pull(){
  if(!sync){setSync('','尚未連線 Google Sheet，資料只存在這台裝置');return;}
  setSync('','同步中…');
  try{
    const r=await fetch(sync.url+'?token='+encodeURIComponent(sync.token));const j=await r.json();
    if(!j.ok)throw new Error(j.error);
    lessons=j.lessons;payments=j.payments||[];claims=j.claims||[];lsSet(LS_CACHE,lessons);lsSet(LS_PAY,payments);lsSet(LS_CLAIM,claims);render();setSync('ok','已同步 Google Sheet · '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSync('err','無法連到 Google Sheet，先顯示這台裝置上的資料');}
}
async function post(body){
  if(!sync)return null;
  setSync('','儲存到 Google Sheet…');
  const r=await fetch(sync.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,token:sync.token})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'failed');
  lessons=j.lessons;payments=j.payments||payments;claims=j.claims||claims;lsSet(LS_CACHE,lessons);lsSet(LS_PAY,payments);lsSet(LS_CLAIM,claims);render();
  setSync('ok','已同步 Google Sheet · '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
  return j;
}
async function saveLessons(list){
  // optimistic local update
  list.forEach(l=>{const i=lessons.findIndex(x=>x.id===l.id);if(i>=0)lessons[i]=l;else lessons.push(l);});
  lsSet(LS_CACHE,lessons);render();
  try{await post({action:'upsert',lessons:list});return true;}
  catch(e){setSync('err','Google Sheet 沒存到，已先存在這台裝置。按「設定 → 重新同步」再試一次');return false;}
}

}

function quizView(b,quiz){
  if(!quiz.length){const p=document.createElement('p');p.className='note';p.textContent='這堂課的筆記不夠做測驗題。';b.append(p);return;}

    b.append(c,qt,opts,ex,nx);
  }
  draw();
}

  const usedUsd=inYear.reduce((a,c)=>a+(Number(c.usd)||0),0);

  const play=(f,t0,d,type,g)=>{const o=actx.createOscillator(),v=actx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);v.gain.setValueAtTime(0.0001,t0);v.gain.exponentialRampToValueAtTime(g||0.18,t0+0.01);v.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(v).connect(actx.destination);o.start(t0);o.stop(t0+d+0.02);};
  if(ok){play(880,t,0.12);play(1320,t+0.11,0.24);}else{play(220,t,0.22,'triangle',0.2);play(170,t+0.13,0.32,'triangle',0.2);}}catch(e){}}

cardsView=function(b,cards){

  const nav=document.createElement('div');nav.className='cardnav';

  const cnt=document.createElement('span');cnt.className='count';

  nav.append(prev,cnt,next);
  const tip=document.createElement('p');tip.className='note';tip.textContent='先看中文，自己用英文說出來，再點卡片看答案並聽發音。';
  function draw(){const c=deck[i];card.innerHTML='';const z=document.createElement('div');z.className='zh';z.textContent=c.zh;card.append(z);
    if(flip){const e=document.createElement('div');e.className='en';const sp=document.createElement('span');sp.textContent=c.en;const bt=spkBtn(c.en);e.append(sp,bt);card.append(e);speak(c.en,bt);}

    cnt.textContent=`${i+1} / ${deck.length}`;prev.disabled=i===0;next.textContent=i===deck.length-1?'重新洗牌':'下一張';}
  card.onclick=()=>{flip=!flip;draw();};card.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();card.onclick();}};
  prev.onclick=()=>{if(i>0){i--;flip=false;draw();}};
  next.onclick=()=>{if(i<deck.length-1)i++;else{deck=shuffle(cards);i=0;}flip=false;draw();};
  b.append(tip,card,nav);draw();
};
quizView=function(b,quiz){

      const again=document.createElement('button');again.className='btn primary';again.type='button';again.textContent='再做一次';again.onclick=()=>{i=0;score=0;draw();};
      b.append(sc,p,again);return;}
    const q=qs[i];const c=document.createElement('div');c.className='count';c.textContent=`第 ${i+1} 題 / 共 ${qs.length} 題`+(q.from?' · '+q.from:'');
    const qt=document.createElement('div');qt.className='q';qt.textContent=q.q;
    const opts=document.createElement('div');opts.className='opts';
    const ex=document.createElement('div');ex.className='explain';ex.hidden=true;
    const nx=document.createElement('button');nx.className='btn primary';nx.type='button';nx.hidden=true;nx.textContent=i===qs.length-1?'看分數':'下一題';nx.onclick=()=>{i++;draw();};
    q.options.forEach((o,k)=>{const bt=document.createElement('button');bt.type='button';bt.className='opt';bt.textContent=String.fromCharCode(65+k)+'. '+o;
      bt.onclick=()=>{if(opts.dataset.done)return;opts.dataset.done='1';const ok=k===q.answer;sfx(ok);
        if(ok){score++;bt.classList.add('right');}else{bt.classList.add('wrong');opts.children[q.answer].classList.add('right');}
        ex.textContent=(ok?'答對了。':'正確答案是 '+String.fromCharCode(65+q.answer)+'。')+(q.explain?' '+q.explain:'');ex.hidden=false;nx.hidden=false;};
      opts.append(bt);});
    b.append(c,qt,opts,ex,nx);
  }
  draw();
};
</script>
</body>
</html>
